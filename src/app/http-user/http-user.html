<p>http-user works!</p>

<input type="text" placeholder="name" [(ngModel)]="name">
<input type="text" placeholder="age" [(ngModel)]="age">
<input type="text" placeholder="email" [(ngModel)]="email">
<input type="text" placeholder="city" [(ngModel)]="city">

<button class="btn btn-success" (click)="sub()">Submit</button>

<div class="container mt-4">

  
    

    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">

        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Email</th>
            <th>City</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let u of list">

            <td>{{ u.name }}</td>
            <td>{{ u.age }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.city }}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-primary me-2"
                      (click)="edit(u)">
                Edit
              </button>
              <button class="btn btn-sm btn-danger"
                      (click)="delete(u.id)">
                Delete
              </button>
            </td>
          </tr>

          
        </tbody>

      </table>
    </div>
  

</div>
